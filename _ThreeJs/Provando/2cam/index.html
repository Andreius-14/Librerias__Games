<!doctype html>
<html lang="en">
  <head>
    <title>three.js webgl - materials - texture filtering</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="main.css" />
    <style>
      body {
        background: red;
      }
      .lbl {
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        position: absolute;
        bottom: 0px;
        z-index: 100;
        text-shadow: #000 1px 1px 1px;
        background-color: rgba(0, 0, 0, 0.8);
        padding: 1em;
      }
      #lbl_left {
        text-align: left;
        left: 0px;
      }
      #lbl_right {
        text-align: left;
        right: 0px;
      }

      .g {
        color: #aaa;
      }
      .c {
        color: #fa0;
      }
    </style>
  </head>

  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
      - texture filtering example<br />
      painting by
      <a href="http://en.wikipedia.org/wiki/Basket_of_Fruit_%28Caravaggio%29"
        >Caravaggio</a
      >
    </div>

    <div id="lbl_left" class="lbl">
      Floor <span class="g">(128x128)</span><br />
      mag: <span class="c">Linear</span><br />
      min: <span class="c">LinearMipmapLinear</span><br />
      <br />
      Painting <span class="g">(748x600)</span><br />
      mag: <span class="c">Linear</span><br />
      min: <span class="c">Linear</span>
    </div>

    <div id="lbl_right" class="lbl">
      Floor <br />
      mag: <span class="c">Nearest</span><br />
      min: <span class="c">Nearest</span><br />
      <br />
      Painting <br />
      mag: <span class="c">Nearest</span><br />
      min: <span class="c">Nearest</span>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../build/three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module" src="./script.js"></script>
  </body>
</html>
